<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참석 등록 · 중랑AX 2030 전략포럼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/common.css">
<style>
body{min-height:100vh;min-height:100dvh}
.topbar{padding-bottom:44px}
.topbar p{margin:6px 0 0;font-size:14px;color:#c9d2e4}
.main{max-width:520px;margin:-28px auto 0;padding:0 16px 130px;position:relative}
.panel{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.step-title{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px}
.step-sub{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.big-input{font-size:20px !important;padding:14px 16px !important;letter-spacing:.02em}
.list{display:flex;flex-direction:column;gap:8px;padding:2px;margin:0 -2px}
.who{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);transition:border-color .15s,background .15s}
.who input{position:absolute;opacity:0;pointer-events:none}
.who .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.who .t{min-width:0}
.who b{display:block;font-size:17px}
.who span{font-size:13.5px;color:var(--muted)}
.who:has(input:checked){border-color:var(--accent);background:var(--soft)}
.who:has(input:checked) .dot{border-color:var(--accent);background:var(--accent)}
.who:has(input:checked) .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--safety)}
.who:has(input:focus-visible){outline:3px solid rgba(0,87,163,.5);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:14px}
.links button{font:inherit;color:var(--jn-blue);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px 0;min-height:32px}
.fields{display:grid;gap:14px}
.notice{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:0 0 14px}
.privacy{font-size:12.5px;color:var(--muted);margin:16px 0 0;padding:10px 12px;background:var(--soft);border-radius:10px;line-height:1.5}
.privacy b{color:var(--text)}
.err{color:var(--bad);font-size:14px;margin:8px 0 0;min-height:1em}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bottom .in{max-width:520px;margin:0 auto}

.result{text-align:center;padding:28px 18px}
.check{width:96px;height:96px;margin:0 auto 14px}
.check circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .7s ease forwards}
.check path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .55s ease forwards}
.result.warn .check circle,.result.warn .check path{stroke:var(--warn)}
@keyframes draw{to{stroke-dashoffset:0}}
.result h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:6px;animation:rise .5s .3s both}
.result .who-line{font-size:18px;font-weight:700;animation:rise .5s .45s both}
.result .meta{color:var(--muted);margin:4px 0 0;animation:rise .5s .55s both}
.result .order{font-family:var(--f-mono);font-weight:600}
.result .hint2{margin:16px 0 0;background:var(--soft);border-radius:12px;padding:12px;font-size:15px;animation:rise .5s .65s both}
.result.warn .hint2{background:var(--warn-soft)}
.result .again{display:inline-block;margin-top:16px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.full{padding:56px 20px;text-align:center}
.full p{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="tri"><i></i><i></i><i></i></div>
  <div class="topbar">
    <div class="eyebrow">중랑구 · 제1차</div>
    <h1>중랑AX 2030 전략포럼 참석 등록</h1>
    <p>등록하면 앞 화면의 중랑구청이 함께 올라갑니다</p>
  </div>
  <div class="hazard"></div>
</header>
<main class="main">
  <section class="panel" id="formPanel" hidden>
    <!-- 1단계: 이름 -->
    <form id="stepName" autocomplete="off">
      <h2 class="step-title">성함을 입력해 주세요</h2>
      <p class="step-sub" style="margin-bottom:8px">사전에 받은 명단으로 찾아 드립니다.<br>명단에 없으면 등록해 드립니다.</p>
      <p class="step-sub">성과 이름을 모두 정확히 적어 주세요.</p>
      <label class="sr" for="qName">성함</label>
      <input type="text" id="qName" class="big-input" maxlength="40" autocomplete="name" placeholder="예: 홍길동" enterkeyhint="search">
    </form>
    <!-- 2단계: 명단에서 찾음 -->
    <div id="stepPick" hidden>
      <h2 class="step-title" id="pickTitle">본인이 맞으신가요?</h2>
      <p class="step-sub" id="pickSub"></p>
      <div class="list" id="list" role="radiogroup" aria-label="본인 고르기"></div>
      <div class="links"><button type="button" data-go="name">성함 다시 입력</button><button type="button" data-go="self">제가 아니에요 · 직접 입력</button></div>
    </div>
    <!-- 2단계: 명단에 없음 → 직접 입력 -->
    <div id="stepSelf" hidden>
      <h2 class="step-title">소속과 직위를 적어 주세요</h2>
      <p class="notice" id="selfNotice">명단에서 찾지 못했어요. 아래를 적고 등록해 주세요.</p>
      <div class="fields">
        <div><label class="f" for="fDept">소속</label><input type="text" id="fDept" maxlength="60" autocomplete="organization" placeholder="예: 스마트정보과, ○○대학교"></div>
        <div><label class="f" for="fRank">직위 <span class="hint">(선택)</span></label><input type="text" id="fRank" maxlength="40" placeholder="예: 주무관, 팀장, 교수"></div>
        <div><label class="f" for="fName">성명</label><input type="text" id="fName" maxlength="40" autocomplete="name"></div>
      </div>
      <div class="links" id="selfLinks"><button type="button" data-go="name">성함 다시 입력</button></div>
    </div>
    <p class="err" id="err" role="alert"></p>
    <p class="privacy"><b>개인정보 안내</b> · 수집 항목: 소속·직위·성명 · 목적: 행사 참석 확인과 행사장 화면 표시(이름·소속이 앞 화면에 나옵니다) · 보관: 행사 후 10일 안에 자동 삭제 · 중랑구청</p>
  </section>
  <section class="panel result" id="result" hidden></section>
  <section class="panel full" id="full" hidden></section>
</main>
<div class="bottom" id="bottom" hidden><div class="in"><button type="button" class="btn primary big" id="go" disabled>성함을 입력해 주세요</button></div></div>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
/* 참석자 휴대폰 등록.
   흐름: 성함 입력 → 서버가 정확히 같은 이름만 찾아 줌(ax_find, 연번·소속만) → 본인 고르기 → 등록(ax_register: 연번+이름)
         찾지 못하거나 "제가 아니에요" → 소속·직위·성명 직접 입력(ax_register_walkin).
   명단 전체는 휴대폰으로 내려오지 않는다(바깥에서 명단을 뽑아 갈 수 없게). */
(function () {
  'use strict';
  const $ = id => document.getElementById(id), A = window.App;
  let step = 'name', hasRoster = true, typed = '', hits = [], chosen = null, busy = false;

  // 휴대폰마다 임의 번호 하나(같은 휴대폰 중복 등록 막기). 저장이 안 되는 브라우저면 이번 접속 동안만
  function deviceId() {
    let d = null;
    try { d = localStorage.getItem('ax-device'); } catch (e) {}
    if (!d || !/^[A-Za-z0-9_-]{8,64}$/.test(d)) {
      const b = new Uint8Array(12); crypto.getRandomValues(b);
      d = 'd' + Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
      try { localStorage.setItem('ax-device', d); } catch (e) {}
    }
    return d;
  }
  const clean = s => s.replace(/\s+/g, '');

  function show(which) { ['formPanel', 'result', 'full'].forEach(id => $(id).hidden = id !== which); $('bottom').hidden = which !== 'formPanel'; }
  function full(t, m) { $('full').innerHTML = `<h2>${A.esc(t)}</h2><p>${A.esc(m)}</p>`; show('full'); }

  /* ---------- 단계 ---------- */
  function setStep(s, notice) {
    step = s; $('err').textContent = '';
    $('stepName').hidden = s !== 'name'; $('stepPick').hidden = s !== 'pick'; $('stepSelf').hidden = s !== 'self';
    if (s === 'self') {
      if (!$('fName').value.trim() && typed) $('fName').value = typed;
      $('selfNotice').textContent = notice || '명단에서 찾지 못했어요. 아래를 적고 등록해 주세요.';
      setTimeout(() => $('fDept').focus(), 50);
    }
    if (s === 'name') setTimeout(() => $('qName').focus(), 50);
    updateButton();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    if (b.dataset.go === 'self') setStep('self', '명단의 분과 다른 분이시군요. 소속과 직위를 적어 주세요.');
    else setStep(b.dataset.go);
  });

  /* ---------- 1단계: 이름으로 찾기 ---------- */
  async function find() {
    const name = $('qName').value.trim();
    if (clean(name).length < 2) { $('err').textContent = '성함을 두 글자 이상 적어 주세요'; return; }
    typed = /^[가-힣\s]+$/.test(name) ? clean(name) : name;   // 한글 이름은 띄어쓰기 없이 보여 줌
    if (!hasRoster) { $('fName').value = typed; return setStep('self', '아래를 적고 등록해 주세요.'); }
    busy = true; $('go').disabled = true; $('go').textContent = '찾는 중…';
    try {
      hits = (await A.rpc('ax_find', { p_name: name })) || [];
      busy = false;
      if (!hits.length) { $('fName').value = typed; return setStep('self'); }
      chosen = hits.length === 1 ? hits[0].no : null;
      $('pickTitle').textContent = hits.length === 1 ? '본인이 맞으신가요?' : '본인을 골라 주세요';
      $('pickSub').textContent = hits.length === 1 ? '맞으면 아래 등록 버튼을 눌러 주세요.' : `같은 성함이 ${hits.length}분 있어요. 소속을 보고 골라 주세요.`;
      $('list').innerHTML = hits.map(p => `<label class="who"><input type="radio" name="who" value="${p.no}" ${chosen === p.no ? 'checked' : ''}>
        <span class="dot" aria-hidden="true"></span><span class="t"><b>${A.esc(typed)}</b><span>${A.esc(p.dept || '소속 없음')}</span></span></label>`).join('');
      setStep('pick');
    } catch (e) {
      busy = false; $('err').textContent = e.message || '찾지 못했습니다. 다시 눌러 주세요.'; updateButton();
    }
  }
  $('stepName').addEventListener('submit', e => { e.preventDefault(); if (!busy) find(); });
  $('list').addEventListener('change', e => { chosen = +e.target.value; $('err').textContent = ''; updateButton(); });
  ['qName', 'fDept', 'fRank', 'fName'].forEach(id => $(id).addEventListener('input', () => updateButton()));

  function updateButton() {
    const go = $('go');
    if (busy) return;
    if (step === 'name') {
      const ok = clean($('qName').value).length >= 2;
      go.disabled = !ok; go.textContent = ok ? (hasRoster ? '명단에서 찾기' : '다음') : '성함을 입력해 주세요';
    } else if (step === 'pick') {
      const p = hits.find(x => x.no === chosen);
      go.disabled = !p; go.textContent = p ? `${typed} 님으로 등록` : '본인을 골라 주세요';
    } else {
      const ok = $('fDept').value.trim() && $('fName').value.trim();
      go.disabled = !ok; go.textContent = ok ? `${$('fName').value.trim()} 님으로 등록` : '소속과 성명을 적어 주세요';
    }
  }

  /* ---------- 결과 ---------- */
  function showResult(r) {
    const warn = r.status !== 'ok' && !(r.status === 'dup' && r.mine);
    let title, hint;
    if (r.status === 'ok') { title = '등록됐습니다'; hint = '앞 화면에서 중랑구청이 올라가는 걸 확인해 보세요!'; }
    else if (r.status === 'dup' && r.mine) { title = '이미 등록했습니다'; hint = '이 휴대폰으로 등록을 마쳤어요. 고맙습니다!'; }
    else if (r.status === 'dup') { title = '이미 등록된 분입니다'; hint = '본인이 등록하지 않았다면 행사 담당자에게 말씀해 주세요.'; }
    else { title = '이 휴대폰은 이미 사용됐어요'; hint = '한 휴대폰에 한 분만 등록할 수 있어요. 위 분이 아니라면 행사 담당자에게 말씀해 주세요.'; }
    $('result').className = 'panel result' + (warn ? ' warn' : '');
    $('result').innerHTML = `<svg class="check" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg>
      <h2>${A.esc(title)}</h2>
      <div class="who-line">${A.esc([r.dept, r.name].filter(Boolean).join(' '))} 님</div>
      <p class="meta">${r.order ? `<span class="order">${r.order}</span>번째 참석 · ` : ''}${r.at ? A.hhmm(r.at) + ' 등록' : ''}</p>
      <p class="hint2">${A.esc(hint)}</p>
      ${r.status === 'ok' || r.mine ? '' : `<button type="button" class="again" id="again">처음부터 다시</button>`}`;
    show('result');
    const again = $('again');
    if (again) again.onclick = () => { chosen = null; $('qName').value = ''; show('formPanel'); setStep('name'); };
  }

  /* ---------- 버튼 ---------- */
  $('go').addEventListener('click', async () => {
    const btn = $('go');
    if (btn.disabled || busy) return;
    if (step === 'name') return find();
    busy = true; btn.disabled = true; btn.textContent = '등록하는 중…';
    try {
      const r = step === 'pick'
        ? await A.rpc('ax_register', { p_no: chosen, p_name: typed, p_device: deviceId() })
        : await A.rpc('ax_register_walkin', { p_dept: $('fDept').value, p_rank: $('fRank').value, p_name: $('fName').value, p_device: deviceId() });
      if (!r || r.status === 'error') throw new Error((r && r.message) || '등록하지 못했습니다');
      if (r.status === 'ok' || (r.status === 'dup' && r.mine) || r.status === 'device') A.rememberRegistration(r);
      busy = false;
      showResult(r);
    } catch (e) {
      busy = false;
      $('err').textContent = e.message || '등록하지 못했습니다. 다시 눌러 주세요.';
      updateButton(); btn.textContent = '다시 등록';
    }
  });

  /* ---------- 시작 ---------- */
  (async function start() {
    if (!A.ready) return full('준비 중입니다', '행사 담당자에게 말씀해 주세요. (저장소 설정 없음)');
    // 이 휴대폰으로 이미 등록했으면 바로 결과
    const mine = A.myRegistration();
    if (mine && mine.name) { showResult({ ...mine, status: 'dup', mine: true }); }
    try {
      const ev = await A.rpc('ax_get_event');
      hasRoster = !!(ev && ev.has_roster);
      setStep('name');
      if (!mine) show('formPanel');
      else {
        // 관리자가 등록을 취소했거나 잘못 고른 경우 다시 할 수 있게(서버가 같은 휴대폰 중복은 다시 막음)
        $('result').insertAdjacentHTML('beforeend', `<br><button type="button" class="again" id="reset">다른 이름으로 다시 등록</button>`);
        $('reset').onclick = () => { A.forgetRegistration(); location.reload(); };
      }
    } catch (e) { if (!mine) full('불러오지 못했습니다', e.message + ' 잠시 뒤 새로 고쳐 주세요.'); }
  })();
})();
</script>
</body>
</html>
